# SPDX-License-Identifier: MIT
# DKMS supplies kernelver/kernel_source_dir and consumes these variables.
# shellcheck disable=SC2034,SC2154
PACKAGE_NAME="kctrace"
PACKAGE_VERSION="0.1.0"
BUILT_MODULE_NAME[0]="kctrace"
BUILT_MODULE_LOCATION[0]="module"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make -C module KERNELRELEASE=${kernelver} KDIR=${kernel_source_dir}"
AUTOINSTALL="yes"
