# shellcheck disable=SC2034,SC2154
# There should not be ${PACKAGE_NAME}.c!
PACKAGE_NAME="kctrace"
KCTRACE_VERSION="unknown"
PACKAGE_VERSION="${KCTRACE_VERSION}"
DEST_MODULE_LOCATION[0]="/kernel/drivers/misc/"

# DO NOT EDIT THE BELOW!

MAKE[0]="make KVER=${kernelver} KDIR=${kernel_source_dir} source_tree=${source_tree} KCTRACE_VERSION=${KCTRACE_VERSION}"
CLEAN="make KVER=${kernelver} KDIR=${kernel_source_dir} source_tree=${source_tree} KCTRACE_VERSION=${KCTRACE_VERSION} clean"
AUTOINSTALL="yes"

POST_BUILD="post_build.sh ${PACKAGE_NAME} ${PACKAGE_VERSION} ${kernelver}"
POST_INSTALL="post_install.sh ${PACKAGE_NAME} ${PACKAGE_VERSION} ${kernelver}"
POST_REMOVE="post_remove.sh ${PACKAGE_NAME} ${kernelver}"
